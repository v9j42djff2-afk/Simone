<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMONE57</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;padding-bottom:200px}
nav{position:sticky;top:0;z-index:99;background:#000;padding:14px;display:flex;justify-content:center;gap:22px;border-bottom:1px solid #1a1a1a}
nav a{color:#fff;text-decoration:none;font-weight:900;font-size:12px;letter-spacing:1.5px}
.hero{text-align:center;padding:40px 20px 30px;background:radial-gradient(circle at center,#1e1e4a,#000 70%)}
.hero img{width:85%;max-width:360px;border-radius:22px}
.hero p{opacity:.6;margin:14px 0 20px;font-size:12px;letter-spacing:2px}
.btn{background:#fff;color:#000;padding:13px 26px;border-radius:30px;text-decoration:none;font-weight:900;font-size:12px;display:inline-block}
h2{text-align:center;margin:35px 0 18px;letter-spacing:4px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px;max-width:600px;margin:0 auto}
.card{background:#151515;border:1px solid #222;border-radius:20px;overflow:hidden;text-align:center}
.card video{width:100%;height:220px;object-fit:cover;background:#111;display:block}
.card h3{margin:12px 0 2px;font-size:12px;letter-spacing:2px}
.price{font-weight:900;margin-bottom:8px}
.qty{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0}
.qty button{width:32px;height:32px;border-radius:50%;border:1px solid #333;background:#000;color:#fff;font-weight:900}
.qty span{font-weight:900;min-width:20px}
.card .add{background:#fff;color:#000;border:none;padding:10px;border-radius:25px;width:85%;font-weight:900;font-size:11px;margin-bottom:12px;cursor:pointer}
.info-wrap{max-width:600px;margin:0 auto;padding:0 14px}
.info-card{background:#151515;border:1px solid #222;border-radius:16px;padding:18px;font-size:13px;line-height:1.6;color:#aaa;text-align:center}
.avis-wrap{max-width:600px;margin:0 auto;padding:0 14px}
.avis{background:#151515;border:1px solid #222;margin:8px 0;padding:16px;border-radius:16px;font-size:13px}
#panier{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#000;padding:16px;border-radius:22px 22px 0 0;z-index:999}
#panier-top{display:flex;justify-content:space-between;font-weight:900}
#adresse{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1px solid #ddd;font-size:14px;display:none}
#cmd{width:100%;background:#000;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:900;margin-top:10px;font-size:13px;letter-spacing:1px;display:none;cursor:pointer}
#clear{font-size:10px;color:#888;background:none;border:none;text-decoration:underline;cursor:pointer;display:none;margin-top:8px}
</style>
</head>
<body>
<nav><a href="#accueil">ACCUEIL</a><a href="#menu">MENU</a><a href="#info">INFO</a><a href="#avis">AVIS</a></nav>
<div class="hero"><img src="logo.jpg"><p>PREMIUM CAFÉ • 50€</p><a class="btn" href="#menu">VOIR LE MENU</a></div>

<div class="card"><video src="caramel.mp4" autoplay loop muted playsinline></video><h3>CARAMEL</h3><div class="price">50€</div><div class="qty"><button onclick="chg(this,-1)">-</button><span>0</span><button onclick="chg(this,1)">+</button></div><button class="add" onclick="chg(this,1)">AJOUTER</button></div>
<div class="card"><video src="canal.mp4" autoplay loop muted playsinline></video><h3>CANAL</h3><div class="price">50€</div><div class="qty"><button onclick="chg(this,-1)">-</button><span>0</span><button onclick="chg(this,1)">+</button></div><button class="add" onclick="chg(this,1)">AJOUTER</button></div>
<div class="card"><video src="chocolat.mp4" autoplay loop muted playsinline></video><h3>CHOCOLAT</h3><div class="price">50€</div><div class="qty"><button onclick="chg(this,-1)">-</button><span>0</span><button onclick="chg(this,1)">+</button></div><button class="add" onclick="chg(this,1)">AJOUTER</button></div>

</div></div>
<div id="info"><h2>INFO</h2><div class="info-wrap"><div class="info-card">📦 50€ GROS<br>📦 Stock dispo & livraison fast</div></div></div>
<div id="avis"><h2>AVIS</h2><div class="avis-wrap"><div class="avis">⭐⭐⭐⭐⭐ Léa - Super rapide !</div></div></div>
<div id="panier"><div id="panier-top"><span id="txt">Panier vide</span><span id="tot">0.00€</span></div><input id="adresse" placeholder="📍 Ton adresse..."><button id="cmd" onclick="commander()">COMMANDER</button><button id="clear" onclick="clearCart()">Vider</button></div>

<script>
let cart=[];
function addPanier(nom,prix){
cart.push({nom,prix});
render();
}
function render(){
let total=0; let noms=[];
cart.forEach(c=>{total+=c.prix; noms.push(c.nom)});
document.getElementById('count').innerText=cart.length;
document.getElementById('panier-list').innerText= cart.length==0 ? 'Panier vide' : noms.join(', ');
document.getElementById('panier-total').innerText= total.toFixed(2)+'€';
}
function commander(){
if(cart.length==0){alert('Panier vide !');return}
let message='Salut SIMONE57, je veux commander: '+cart.map(c=>c.nom+' (9€)').join(', ')+'. Total: '+cart.reduce((a,b)=>a+b.prix,0)+'€';
let numero='‪+33 7 44 14 61 89‬'; // <--- METS TON NUMERO ICI EX: 33612345678
window.open('https://wa.me/'‪+33 7 44 14 61 89‬+'?text='+encodeURIComponent(message),'_blank');
cart=[];render();
}
render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simone • Paris</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ... garde tout ton CSS ... */
.btn-stars{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#000;border:none;padding:16px;border-radius:16px;font-weight:900;width:100%;font-size:14px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-espece{background:#1a1a1a;border:1px solid #333;color:#fff;padding:16px;border-radius:16px;font-weight:900;width:100%;font-size:14px;cursor:pointer;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px}
</style>
</head>
<body>
<!-- ... tout ton HTML jusqu'au panier ... -->

<div id="cartDrawer" class="cart-drawer">
<div style="display:flex;justify-content:space-between"><h3>🛒 Panier</h3><button onclick="closeCart()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div>
<div id="cartList"></div>
<div style="display:flex;justify-content:space-between;margin:14px 0;font-weight:900"><span>Total</span><span id="cartTotal">0€</span></div>
<input id="addr" class="input" placeholder="📍 Adresse + code postal">
<div class="hours"><button type="button" class="active" onclick="selectHour(this)">Au plus vite ⚡</button><button type="button" onclick="selectHour(this)">11h-13h</button><button type="button" onclick="selectHour(this)">18h-20h</button><button type="button" onclick="selectHour(this)">20h-23h</button></div>
<input id="note" class="input" placeholder="Note livreur">
<div style="margin-top:16px;border-top:1px solid #222;padding-top:16px">
<div style="font-size:11px;opacity:0.5;font-weight:800;letter-spacing:1px;margin-bottom:10px">CHOISIS TON MODE DE PAIEMENT</div>
<button class="btn-espece" onclick="checkoutCash()">💵 Payer en Espèces</button>
<button class="btn-stars" onclick="checkoutStars()">⭐ Payer en Stars (Telegram)</button>
</div>
</div>

<script>
// ... garde tout ton script jusqu'à selectHour ...

// ANCIEN CHECKOUT RENOMMÉ
async function checkoutCash(){ /* ton ancien code */ }

// NOUVEAU CHECKOUT STARS
async function checkoutStars(){
 let total=0;for(let id in cart){total+=cart[id].total;}
 if(total===0){alert("Panier vide !");return;}
 let addr=document.getElementById('addr').value.trim();
 if(!addr){alert("Adresse !");openCart();return;}
 let tg=window.Telegram?.WebApp;
 if(!tg){alert("Ouvre depuis Telegram pour payer en Stars");return;}
 let starsAmount = Math.max(1, Math.round(total * 2));
 let token = getBotTokens()[0];
 let resp = await fetch(`https://api.telegram.org/bot${token}/createInvoiceLink`,{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({
     title: "Commande Simone Paris",
     description: `Commande ${total}€`,
     payload: "stars_"+Date.now(),
     currency: "XTR",
     prices: [{label: `Commande ${total}€`, amount: starsAmount}]
   })
 });
 let data = await resp.json();
 if(!data.ok){alert("Erreur Stars: "+data.description);return;}
 tg.openInvoice(data.result, async function(status){
   if(status==='paid'){
     let order={id:'CMD-STAR-'+Date.now().toString().slice(-6),time:Date.now(),date:new Date().toLocaleString('fr-FR'),items:Object.values(cart).map(i=>`${i.name} - ${i.qteLabel} x${i.qty} = ${i.total}€`).join('<br>'),total:total,starsPaid:starsAmount,customerName:getTelegramName(),telegramId:getTelegramUser()?.id||null,telegramUsername:getTelegramUser()?.username||null,address:addr,hour:selectedHour,note:document.getElementById('note').value,remaining:40,status:'en attente',statusStep:1,deviceId:DEVICE_ID,paymentMethod:`STARS ⭐ ${starsAmount} Stars`};
     orders.unshift(order);fullHistory.unshift(order);await saveAll();await notifyAdminNewOrder(order);localStorage.setItem('simone_myOrder',JSON.stringify(order));cart={};updateCart();closeCart();checkMyOrder();
     if(tg.showAlert) tg.showAlert(`✅ Payé ${starsAmount} Stars !`); else alert(`✅ Payé ${starsAmount} Stars !`);
   }
 });
}
</script>
</body>
</html>

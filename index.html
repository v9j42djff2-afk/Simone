<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Simone</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding-bottom:90px}
.admin-btn-top{position:fixed;top:10px;left:10px;z-index:400;background:#111;border:1px solid #333;color:#fff;padding:8px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer}
.my-order-banner{display:none;margin:12px;border-radius:16px;padding:18px;text-align:center;border:1px solid #ff3b3b}
.my-order-banner.show{display:block}
.my-order-banner.banned{background:#111;border-color:#ff1a1a}
.my-order-banner.canceled{background:#222;border-color:#666}
.my-order-banner.arrived{background:linear-gradient(135deg,#25D366,#128C7E)!important;border-color:#25D366!important}
.my-order-banner.closed{background:#333;border-color:#666}
.header{text-align:center;padding:40px 15px 22px;background:radial-gradient(circle at top,#2a0a0a,#000);border-bottom:1px solid #222}
.header img{width:180px;border-radius:20px;box-shadow:0 0 30px rgba(255,0,0,0.5);background:#000}
.header h1{font-size:28px;font-weight:900;letter-spacing:2px;margin-top:14px}
.header h1 span{color:#ff1a1a}
.section-title{padding:18px 15px 8px;font-size:11px;letter-spacing:2px;opacity:0.6;font-weight:800}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px}
.card{background:#161616;border:1px solid #222;border-radius:18px;padding:10px;cursor:pointer}
.card video{width:100%;height:130px;border-radius:12px;object-fit:cover;background:#000;display:block;pointer-events:none}
.card h3{font-size:12px;margin:8px 0 2px}
.tag{display:inline-block;font-size:8px;padding:3px 6px;border-radius:8px;font-weight:800;background:#ff1a1a}
.price{font-size:13px;font-weight:900;color:#ff3b3b;margin-top:4px}
.avis-section{padding:12px}
.avis-card{background:#161616;border:1px solid #222;border-radius:15px;padding:12px;margin-bottom:8px;font-size:12px}
.info-box{background:#161616;border:1px solid #222;border-radius:15px;padding:14px;margin-bottom:10px}
.input,.textarea{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:12px;border-radius:11px;margin-top:8px;font-size:13px;outline:none}
.cart-float{position:fixed;bottom:18px;right:18px;background:#ff1a1a;color:#fff;width:62px;height:62px;border-radius:50%;display:none;align-items:center;justify-content:center;z-index:200;cursor:pointer;font-size:22px}
.cart-float.show{display:flex}
.cart-float .badge{position:absolute;top:-4px;right:-4px;background:#fff;color:#000;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.cart-drawer{position:fixed;bottom:0;left:0;right:0;background:#121212;border-top:1px solid #222;border-radius:22px 22px 0 0;padding:20px;transform:translateY(110%);transition:0.35s;z-index:300;max-height:92vh;overflow:auto}
.cart-drawer.open{transform:translateY(0)}
.hours{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hours button{padding:8px 12px;border-radius:20px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:11px;cursor:pointer}
.hours button.active{background:#ff1a1a;border-color:#ff1a1a;font-weight:800}
.btn-main{background:linear-gradient(135deg,#ff1a1a,#b30000);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:14px;cursor:pointer;margin-top:10px}
.admin-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;z-index:5000;overflow:auto;transform:translateY(100%);transition:0.4s;padding:16px}
.admin-panel.open{transform:translateY(0)}
.admin-order{background:#161616;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:12px}
.admin-timer{font-size:22px;font-weight:900;color:#ffcc00}
.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin-actions button{padding:8px 10px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:11px;font-weight:800;cursor:pointer}
.admin-input{width:70px;background:#000;border:1px solid #333;color:#ffcc00;padding:8px;border-radius:8px;text-align:center;font-weight:900}
.admin-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.admin-tabs button{flex:1;min-width:70px;padding:10px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;font-weight:800;cursor:pointer;font-size:10px}
.admin-tabs button.active{background:#ff1a1a;border-color:#ff1a1a}
.product-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#070707;z-index:1000;overflow:auto;transform:translateY(100%);transition:0.35s;display:flex;flex-direction:column}
.product-modal.open{transform:translateY(0)}
.btn-qte{background:#161616;border:1px solid #333;border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.btn-qte.active{background:#fff;color:#000;border-color:#fff}
.btn-qte b{display:block;font-size:14px;font-weight:900}
.status-steps{display:flex;gap:4px;margin-top:12px}
.status-steps div{flex:1;height:6px;background:#222;border-radius:10px}
.status-steps div.active{background:#ff1a1a}
.status-steps div.done{background:#25D366}
.ban-box{background:rgba(255,26,26,0.1);border:1px dashed #ff1a1a;border-radius:12px;padding:10px;margin-top:10px}
.hist-item{background:#111;border:1px solid #222;border-radius:14px;padding:12px;margin-bottom:8px;font-size:12px}
.prod-admin{background:#161616;border:1px solid #222;border-radius:14px;padding:12px;display:flex;gap:10px;margin-bottom:10px;align-items:center}
.prod-admin video{width:60px;height:60px;border-radius:10px;object-fit:cover;background:#000}
</style>
</head>
<body>
<button class="admin-btn-top" onclick="openAdmin()">🔐 ADMIN</button>
<div class="header"><img src="logo.png.jpg"><h1>COFFEE <span>SIMONE</span></h1><p>COLLECTION EXCLUSIVE</p></div>
<div id="closedBanner" class="my-order-banner closed"><p>🔒 FERMÉ</p><b>OUVERT 11H-23H</b></div>
<div id="myOrderBanner" class="my-order-banner" style="background:linear-gradient(135deg,#ff1a1a,#b30000)"><p id="myOrderStatus">COMMANDE</p><b id="myOrderTimer">En attente</b><div class="status-steps" id="mySteps"><div class="active"></div><div></div><div></div><div></div></div><p id="myOrderId" style="font-size:11px;margin-top:8px;opacity:0.7"></p></div>
<div id="bannedBanner" class="my-order-banner banned"><b>TU ES BANNI</b><p id="bannedUntil"></p></div>
<div id="canceledBanner" class="my-order-banner canceled"><b>ANNULÉ</b><p id="canceledId"></p></div>
<div class="section-title">MENU</div><div class="menu-grid" id="menuGrid"></div>
<div class="avis-section"><div id="avisList"></div><div class="info-box"><input id="avisName" class="input" placeholder="Pseudo"><textarea id="avisText" class="textarea" placeholder="Ton avis..."></textarea><button class="btn-main" onclick="postAvis()">Envoyer avis</button></div></div>
<div id="cartFloat" class="cart-float" onclick="openCart()">🛒<span id="cartBadge" class="badge">0</span></div>
<div id="cartDrawer" class="cart-drawer"><div style="display:flex;justify-content:space-between"><h3>Panier</h3><button onclick="closeCart()" style="background:none;border:none;color:#fff;font-size:22px">✕</button></div><div id="cartList"></div><div style="display:flex;justify-content:space-between;margin:14px 0;font-weight:900"><span>Total</span><span id="cartTotal">0€</span></div><input id="addr" class="input" placeholder="Adresse"><div class="hours"><button type="button" class="active" onclick="selectHour(this)">Au plus vite ⚡</button><button type="button" onclick="selectHour(this)">11h-13h</button><button type="button" onclick="selectHour(this)">18h-20h</button></div><input id="note" class="input" placeholder="Note"><button class="btn-main" onclick="checkout()">Commander 🚀</button></div>
<div id="productModal" class="product-modal"><div style="display:flex;justify-content:space-between;padding:14px"><button onclick="closeProduct()" style="background:#1a1a1a;border:1px solid #333;color:#fff;width:36px;height:36px;border-radius:50%">✕</button></div><video id="prodVideo" autoplay muted loop playsinline style="width:100%;height:42vh;object-fit:cover"></video><div style="padding:16px"><h2 id="prodName"></h2><div id="prodDesc" style="margin-top:10px;background:#151515;border:1px solid #222;border-radius:12px;padding:12px;font-size:13px"></div><div id="qteGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px"></div></div><div style="position:sticky;bottom:0;background:#070707;padding:14px"><button id="prodAddBtn" class="btn-main">Ajouter</button></div></div>

<div id="adminPanel" class="admin-panel"><div style="display:flex;justify-content:space-between"><h2>ADMIN</h2><button onclick="closeAdmin()" style="background:#222;color:#fff;width:36px;height:36px;border-radius:50%">✕</button></div><div id="adminLogin"><input id="adminPass" class="input" type="password" placeholder="Mot de passe"><button class="btn-main" onclick="loginAdmin()">Déverrouiller</button><p id="adminError" style="color:#ff1a1a;display:none">Mauvais mot de passe</p></div><div id="adminContent" style="display:none"><div class="admin-tabs"><button id="tabOrders" class="active" onclick="switchAdminTab('orders')">📦 (<span id="adminCount">0</span>)</button><button id="tabHist" onclick="switchAdminTab('hist')">📜 Hist</button><button id="tabProd" onclick="switchAdminTab('prod')">🛍️ Produits (<span id="adminProdCount">0</span>)</button><button id="tabBans" onclick="switchAdminTab('bans')">🚫 Bans (<span id="adminBansCount">0</span>)</button><button id="tabAvis" onclick="switchAdminTab('avis')">⭐ Avis (<span id="adminAvisCount">0</span>)</button></div>
<div id="adminOrdersView"><div id="adminOrdersList"></div><button onclick="clearAllOrders()" style="background:#ff1a1a;color:#fff;padding:8px 12px;border-radius:10px;border:none;margin-top:10px">Vider commandes en cours</button></div>
<div id="adminHistView" style="display:none"><div id="adminHistList"></div><button onclick="clearHist()" style="margin-top:10px;background:#333;color:#fff;padding:8px 12px;border-radius:10px">Vider historique</button></div>
<div id="adminProdView" style="display:none">
<div class="info-box">
<h4 style="color:#ff1a1a">➕ Ajouter produit + vidéo depuis tel</h4>
<input id="newProdName" class="input" placeholder="Nom ex: MOUSSEUX">
<input id="newProdTag" class="input" placeholder="Tag ex: TOP">
<input type="file" id="newProdVideoFile" accept="video/*" class="input">
<p id="videoUploadStatus" style="font-size:11px;margin-top:6px;display:none"></p>
<input id="newProdVideo" class="input" placeholder="OU colle URL vidéo ou nom fichier">
<input id="newProdDesc" class="input" placeholder="Description">
<input id="newProdVariants" class="input" placeholder="Variantes ex: 10G:50, 50G:170">
<button class="btn-main" id="addProdBtn" onclick="addProduct()">Ajouter produit ✅</button>
<p style="font-size:9px;opacity:0.5;margin-top:6px">Vidéo max 50Mo, upload auto sur catbox.moe (léger)</p>
</div>
<div id="adminProdList"></div>
</div>
<div id="adminBansView" style="display:none"><div id="adminBansList"></div><button onclick="clearAllBans()" style="background:#333;color:#fff;padding:8px 12px;border-radius:10px;margin-top:10px">Tout débannir</button></div>
<div id="adminAvisView" style="display:none"><div id="adminAvisList"></div></div>
</div></div>

<script>
const _0xenc = {p:"Tm9yYmVyOTMxMDAvLw==",t:["ODk2NjM5Nzk3MjpBQUdUUnN1TFU4VHFTbkxuT3RWQ2NpSlh4dkZrMF9YS2FYSQ==","ODk4NTc4ODkyNTpBQUV4c1lJckhSV0F5QmQ2ajlVakEzRVFyRWpmQWtXQXdsQQ==","ODkwNDgwMDA1OTpBQUhpdHVlb0hZQzFnOV9WeWZpbDMzSWJBNWlqMGxjT3d3Zw=="],a:"ODE3NTMwNjc4Mw=="};
function _0xdec(s){try{return atob(s)}catch(e){return""}}
const ADMIN_PASSWORD=_0xdec(_0xenc.p);const ADMIN_ID=_0xdec(_0xenc.a);
function getBotTokens(){return _0xenc.t.map(_0xdec)}
const NPOINT_URL="https://api.npoint.io/2d35186dfe62583dd8a9";
function getDeviceId(){let id=localStorage.getItem('simone_device');if(!id){id='DEV-'+Date.now()+Math.random().toString(36).slice(2,5);localStorage.setItem('simone_device',id)}return id}
let DEVICE_ID=getDeviceId();
function getTelegramUser(){try{let tg=window.Telegram?.WebApp;if(tg)tg.ready();return tg?.initDataUnsafe?.user||null}catch(e){return null}}
function getTelegramName(){let u=getTelegramUser();if(u){let n=(u.first_name||'')+(u.last_name?' '+u.last_name:'');if(u.username)n+=' @'+u.username;return n.trim()}return 'Client'}
async function sendTelegramMsg(id,msg){if(!id)return false;for(let token of getBotTokens()){try{let r=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:id,text:msg,parse_mode:'HTML'})});if(r.ok)return true}catch(e){}}return false}
async function notifyAdminNewOrder(o){await sendTelegramMsg(ADMIN_ID,`🔔 NOUVELLE COMMANDE !\n📦 ${o.id}\n👤 ${o.customerName}\n💰 ${o.total}€\n📍 ${o.address}\n\n${o.items}`)}
function openAdmin(){document.getElementById('adminPanel').classList.add('open');fetchAll()}
function closeAdmin(){document.getElementById('adminPanel').classList.remove('open')}
function loginAdmin(){let p=document.getElementById('adminPass').value.trim();if(p===ADMIN_PASSWORD){document.getElementById('adminLogin').style.display='none';document.getElementById('adminContent').style.display='block';fetchAll()}else{document.getElementById('adminError').style.display='block'}}
function switchAdminTab(tab){document.getElementById('tabOrders').classList.toggle('active',tab==='orders');document.getElementById('tabHist').classList.toggle('active',tab==='hist');document.getElementById('tabProd').classList.toggle('active',tab==='prod');document.getElementById('tabBans').classList.toggle('active',tab==='bans');document.getElementById('tabAvis').classList.toggle('active',tab==='avis');document.getElementById('adminOrdersView').style.display=tab==='orders'?'block':'none';document.getElementById('adminHistView').style.display=tab==='hist'?'block':'none';document.getElementById('adminProdView').style.display=tab==='prod'?'block':'none';document.getElementById('adminBansView').style.display=tab==='bans'?'block':'none';document.getElementById('adminAvisView').style.display=tab==='avis'?'block':'none';if(tab==='hist')renderHist();if(tab==='prod')renderProdAdmin()}

let DEFAULT_PRODUCTS={
 p1:{id:'p1',name:'MOUSSEUX',tag:'TOP',video:'mousseux.mp4.MP4',desc:'Best', variants:[{label:'10G',price:50}]},
 p2:{id:'p2',name:'FROZEN',tag:'FRESH',video:'frozen.mp4',variants:[{label:'10G',price:130}]},
 p3:{id:'p3',name:'PINEAPPLE',tag:'CALI',video:'caliab .mov',variants:[{label:'10G',price:100}]},
 p4:{id:'p4',name:'COCA',tag:'COLOMBIA',video:'coca.mp4.MP4',variants:[{label:'2G',price:120}]}
};
let PRODUCTS={...DEFAULT_PRODUCTS};
let cart={},selectedHour="Au plus vite",currentProd=null,selectedVariant=null,orders=[],avisList=[],bannedList=[],fullHistory=[],hasFetchedOnce=false,prevOrdersCount=0,pendingVideoUrl=null,uploading=false;

async function fetchAll(){
  try{
    let r=await fetch(NPOINT_URL+"?_="+Date.now());
    let data=await r.json();
    let old=orders;
    if(Array.isArray(data)){orders=data;fullHistory=data;PRODUCTS={...DEFAULT_PRODUCTS}}
    else{
      orders=data.orders||[];avisList=data.avis||[];bannedList=data.banned||[];fullHistory=data.fullHistory||[];
      if(data.products && Object.keys(data.products).length>0)PRODUCTS=data.products;else PRODUCTS={...DEFAULT_PRODUCTS}
      if(fullHistory.length===0&&orders.length>0)fullHistory=[...orders];
    }
    bannedList=bannedList.filter(b=>!b.until||b.until>Date.now());
    for(let o of orders){if(!fullHistory.find(h=>h.id===o.id))fullHistory.unshift(o)}
    if(fullHistory.length>100)fullHistory=fullHistory.slice(0,100);
    if(orders.length>prevOrdersCount&&prevOrdersCount!==0&&hasFetchedOnce){let news=orders.filter(o=>!old.find(oo=>oo.id===o.id));for(let o of news)await notifyAdminNewOrder(o)}
    prevOrdersCount=orders.length;
  }catch(e){console.log('fetch error',e)}
  hasFetchedOnce=true;buildGrid();renderAdminOrders();renderHist();renderProdAdmin();renderAdminBans();renderAvis();checkBanned();checkMyOrder();
}
async function saveAll(){
  try{
    let payload={orders,avis:avisList,banned:bannedList,fullHistory,products:PRODUCTS};
    let str=JSON.stringify(payload);
    if(str.length>450000){alert('⚠️ Trop lourd ! Supprime des anciennes vidéos ou commandes. Payload: '+(str.length/1024).toFixed(0)+'Ko');return false}
    let res=await fetch(NPOINT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:str});
    return res.ok;
  }catch(e){alert('Erreur sauvegarde');return false}
}
function buildGrid(){let g=document.getElementById('menuGrid');let h='';for(let id in PRODUCTS){let p=PRODUCTS[id];h+=`<div class="card" onclick="openProduct('${id}')"><video src="${p.video}" autoplay muted loop playsinline></video><h3>${p.name}</h3><div class="price">${p.variants[0].price}€</div></div>`}g.innerHTML=h;let c=document.getElementById('adminProdCount');if(c)c.textContent=Object.keys(PRODUCTS).length}
function openProduct(id){currentProd=PRODUCTS[id];if(!currentProd)return;currentProd.id=id;selectedVariant=null;document.getElementById('prodVideo').src=currentProd.video;document.getElementById('prodName').textContent=currentProd.name;document.getElementById('prodDesc').textContent=currentProd.desc||'';let q='';currentProd.variants.forEach(v=>{q+=`<div class="btn-qte" onclick="selectVariant(this,'${v.label}',${v.price})"><b>${v.label}</b><span>${v.price}€</span></div>`});document.getElementById('qteGrid').innerHTML=q;document.getElementById('productModal').classList.add('open')}
function closeProduct(){document.getElementById('productModal').classList.remove('open')}
function selectVariant(el,l,p){document.querySelectorAll('#qteGrid .btn-qte').forEach(b=>b.classList.remove('active'));el.classList.add('active');selectedVariant={label:l,price:p};document.getElementById('prodAddBtn').textContent=`Ajouter ${l} - ${p}€`}
function addProdToCart(){if(!selectedVariant)return;let id=currentProd.id+'_'+selectedVariant.label;if(!cart[id])cart[id]={name:currentProd.name,qteLabel:selectedVariant.label,price:selectedVariant.price,qty:1,total:selectedVariant.price};else{cart[id].qty++;cart[id].total=cart[id].qty*cart[id].price}updateCart();closeProduct();openCart()}
function isBanned(){return !!bannedList.find(x=>x.deviceId===DEVICE_ID)}
function checkBanned(){let b=bannedList.find(x=>x.deviceId===DEVICE_ID);let el=document.getElementById('bannedBanner');if(b){el.classList.add('show');document.getElementById('bannedUntil').textContent=b.until?new Date(b.until).toLocaleString():'Définitif';return true}else{el.classList.remove('show');return false}}
async function postAvis(){let name=document.getElementById('avisName').value.trim()||getTelegramName(),text=document.getElementById('avisText').value.trim();if(!text)return;avisList.unshift({name,text,date:new Date().toLocaleString(),deviceId:DEVICE_ID});await saveAll();renderAvis()}
function renderAvis(){let html='';avisList.forEach(a=>{html+=`<div class="avis-card"><b>${a.name}</b><br>${a.text}</div>`});document.getElementById('avisList').innerHTML=html;document.getElementById('adminAvisCount').textContent=avisList.length}
function updateCart(){let t=0,c=0,l='';for(let id in cart){t+=cart[id].total;c+=cart[id].qty;l+=`<div style="display:flex;justify-content:space-between;margin:8px 0;background:#1a1a1a;padding:10px;border-radius:10px"><span>${cart[id].name} ${cart[id].qteLabel} x${cart[id].qty}</span><span>${cart[id].total}€</span></div>`}document.getElementById('cartBadge').textContent=c;document.getElementById('cartList').innerHTML=l||'Vide';document.getElementById('cartTotal').textContent=t+'€';document.getElementById('cartFloat').classList.toggle('show',c>0)}
function openCart(){document.getElementById('cartDrawer').classList.add('open')}
function closeCart(){document.getElementById('cartDrawer').classList.remove('open')}
function selectHour(el){document.querySelectorAll('.hours button').forEach(b=>b.classList.remove('active'));el.classList.add('active');selectedHour=el.textContent}
async function checkout(){if(isBanned())return alert('Banni');let total=0;for(let id in cart)total+=cart[id].total;if(total===0)return;let addr=document.getElementById('addr').value.trim();if(!addr)return alert('Adresse');let tg=getTelegramUser();let order={id:'CMD-'+Date.now().toString().slice(-6),time:Date.now(),date:new Date().toLocaleString(),items:Object.values(cart).map(i=>`${i.name} - ${i.qteLabel} x${i.qty} = ${i.total}€`).join('<br>'),total,customerName:getTelegramName(),telegramId:tg?.id||null,telegramUsername:tg?.username||null,address:addr,status:'en attente',statusStep:1,deviceId:DEVICE_ID,remaining:40};orders.unshift(order);fullHistory.unshift(order);let ok=await saveAll();if(ok){await notifyAdminNewOrder(order);localStorage.setItem('simone_myOrder',JSON.stringify(order));cart={};updateCart();closeCart();checkMyOrder();alert('Commande envoyée')}}
document.getElementById('prodAddBtn').addEventListener('click',addProdToCart);
function checkMyOrder(){let my=JSON.parse(localStorage.getItem('simone_myOrder')||'null');let banner=document.getElementById('myOrderBanner');if(!my){banner.classList.remove('show');return}let found=orders.find(o=>o.id===my.id);if(!found&&hasFetchedOnce&&(Date.now()-my.time)>15000){localStorage.removeItem('simone_myOrder');banner.classList.remove('show');return}let d=found||my;document.getElementById('myOrderId').textContent=d.id+' - '+d.total+'€';document.getElementById('myOrderStatus').textContent=d.status;document.getElementById('myOrderTimer').textContent=d.status;banner.classList.add('show')}
setInterval(()=>{checkMyOrder();checkBanned()},1000);setInterval(fetchAll,5000);

function renderAdminOrders(){let list=document.getElementById('adminOrdersList');document.getElementById('adminCount').textContent=orders.length;if(orders.length===0){list.innerHTML='Aucune commande';return}let html='';orders.forEach((o,idx)=>{html+=`<div class="admin-order"><b>${o.id}</b> - ${o.date}<br><b>${o.customerName}</b> - ${o.total}€ - ${o.status}<br><div style="font-size:12px">${o.items}</div><div>📍 ${o.address}</div><div class="admin-actions"><button onclick="updateStatus(${idx},'en préparation',2)">Prépa</button><button onclick="updateStatus(${idx},'en route',3)">En route</button><button onclick="updateStatus(${idx},'livré',4)" style="background:#25D366;color:#fff">Arrivé</button><button onclick="banUserByOrder(${idx},0)" style="background:#ff1a1a;color:#fff">Ban Déf</button><button onclick="deleteOrder(${idx})" style="background:#ff1a1a;color:#fff">Suppr</button></div></div>`});list.innerHTML=html}
function renderHist(){let list=document.getElementById('adminHistList');let last30=fullHistory.slice(0,30);if(last30.length===0){list.innerHTML='Aucun historique';return}let html='';last30.forEach(o=>{html+=`<div class="hist-item"><b>${o.id}</b> - ${o.date}<br><b>${o.customerName}</b> - ${o.total}€<br><div style="background:#1a1a1a;padding:6px;border-radius:8px;margin:4px 0">${o.items}</div>📍 ${o.address}<br><div class="admin-actions"><button onclick="banDevice('${o.deviceId}','${o.customerName}')" style="background:#ff1a1a;color:#fff">Ban Déf</button></div></div>`});list.innerHTML=html}
function renderProdAdmin(){let list=document.getElementById('adminProdList');if(!list)return;let html='';for(let id in PRODUCTS){let p=PRODUCTS[id];let vars=p.variants.map(v=>`${v.label}:${v.price}€`).join(', ');html+=`<div class="prod-admin"><video src="${p.video}" muted></video><div style="flex:1"><b style="color:#ff1a1a">${p.name}</b><br><small style="opacity:0.6">${p.tag}</small><br><small>${vars}</small></div><button onclick="deleteProduct('${id}')" style="background:#ff1a1a;border:none;color:#fff;padding:8px 12px;border-radius:10px;font-weight:800">Suppr</button></div>`}list.innerHTML=html||'<p style="opacity:0.5">Aucun produit</p>';buildGrid()}
function renderAdminBans(){let list=document.getElementById('adminBansList');document.getElementById('adminBansCount').textContent=bannedList.length;if(bannedList.length===0){list.innerHTML='Aucun banni';return}let html='';bannedList.forEach((b,i)=>{html+=`<div class="admin-order"><b>${b.name||''} - ${b.deviceId}</b><br>Fin: ${b.until?new Date(b.until).toLocaleString():'DEFINITIF'}<br><button onclick="unbanUser(${i})" style="background:#25D366;color:#fff;border:none;padding:6px 10px;border-radius:8px;margin-top:6px">Débannir</button></div>`});list.innerHTML=html}
function renderAdminAvis(){let list=document.getElementById('adminAvisList');if(avisList.length===0){list.innerHTML='Aucun avis';return}let html='';avisList.forEach((a,i)=>{html+=`<div class="admin-order"><b>${a.name}</b><br>${a.text}<br><button onclick="deleteAvis(${i})" style="background:#ff1a1a;color:#fff;border:none;padding:6px 10px;border-radius:8px;margin-top:6px">Suppr</button></div>`});list.innerHTML=html}

async function uploadToCatbox(file){
  let fd=new FormData();
  fd.append('reqtype','fileupload');
  fd.append('fileToUpload',file);
  try{
    let res=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});
    let url=await res.text();
    if(url.startsWith('https://')) return url.trim();
    return null;
  }catch(e){return null}
}

document.getElementById('newProdVideoFile').addEventListener('change', async (e)=>{
  let file=e.target.files[0];if(!file)return;
  let status=document.getElementById('videoUploadStatus');
  status.style.display='block';
  status.style.color='#ffcc00';
  status.textContent='⏳ Upload vidéo en cours... ne ferme pas';
  document.getElementById('addProdBtn').disabled=true;
  document.getElementById('addProdBtn').textContent='Upload en cours...';
  uploading=true;
  let url=await uploadToCatbox(file);
  uploading=false;
  document.getElementById('addProdBtn').disabled=false;
  document.getElementById('addProdBtn').textContent='Ajouter produit ✅';
  if(url){
    pendingVideoUrl=url;
    status.style.color='#25D366';
    status.textContent='✅ Vidéo uploadée ! URL: '+url;
    document.getElementById('newProdVideo').value=url;
  }else{
    status.style.color='#ff1a1a';
    status.textContent='❌ Erreur upload, réessaie ou mets nom fichier existant';
    pendingVideoUrl=null;
  }
});

async function addProduct(){
  if(uploading){alert('Attends fin upload');return}
  let name=document.getElementById('newProdName').value.trim();
  let tag=document.getElementById('newProdTag').value.trim()||'NOUVEAU';
  let videoText=document.getElementById('newProdVideo').value.trim();
  let desc=document.getElementById('newProdDesc').value.trim()||name;
  let variantsStr=document.getElementById('newProdVariants').value.trim();
  if(!name||!variantsStr){alert('Nom + Variantes obligatoires');return}
  let finalVideo=pendingVideoUrl||videoText;
  if(!finalVideo){alert('Mets une vidéo');return}
  let variants=[];variantsStr.split(',').forEach(pair=>{let [l,p]=pair.split(':');if(l&&p)variants.push({label:l.trim(),price:parseInt(p.trim())})});
  if(variants.length===0){alert('Variantes invalides ex: 10G:50');return}
  let id='p'+Date.now();
  PRODUCTS[id]={id,name,tag,video:finalVideo,desc,variants};
  let ok=await saveAll();
  if(ok){
    renderProdAdmin();
    document.getElementById('newProdName').value='';document.getElementById('newProdTag').value='';document.getElementById('newProdVideo').value='';document.getElementById('newProdDesc').value='';document.getElementById('newProdVariants').value='';document.getElementById('newProdVideoFile').value='';pendingVideoUrl=null;document.getElementById('videoUploadStatus').style.display='none';
    alert('✅ Produit ajouté !');
  }
}
async function deleteProduct(id){if(!confirm('Supprimer '+PRODUCTS[id].name+' ?'))return;delete PRODUCTS[id];await saveAll();renderProdAdmin()}
async function banDevice(id,name){if(!id)return;await fetchAll();bannedList=bannedList.filter(b=>b.deviceId!==id);bannedList.push({deviceId:id,name,until:null,date:new Date().toLocaleString()});await saveAll();renderAdminBans()}
async function banUserByOrder(idx,m){let o=orders[idx];let until=m===0?null:Date.now()+m*60000;await fetchAll();bannedList=bannedList.filter(b=>b.deviceId!==o.deviceId);bannedList.push({deviceId:o.deviceId,name:o.customerName,until,date:new Date().toLocaleString()});await saveAll();renderAdminBans()}
async function unbanUser(i){bannedList.splice(i,1);await saveAll();renderAdminBans()}
async function clearAllBans(){bannedList=[];await saveAll();renderAdminBans()}
async function updateStatus(idx,status,step){orders[idx].status=status;orders[idx].statusStep=step;if(status==='livré')orders[idx].remaining=0;await saveAll();renderAdminOrders();checkMyOrder();if(status==='livré'){let o=orders[idx];if(o.telegramId)await sendTelegramMsg(o.telegramId,`✅ LIVREUR ARRIVÉ !\n📦 ${o.id} - ${o.total}€\n📍 ${o.address}`)}}
async function deleteOrder(idx){if(confirm('Supprimer en cours ? Gardée en histo')){orders.splice(idx,1);await saveAll();renderAdminOrders()}}
async function clearAllOrders(){if(confirm('Vider commandes en cours ? Historique gardé')){orders=[];await saveAll();renderAdminOrders();localStorage.removeItem('simone_myOrder')}}
async function clearHist(){if(confirm('Vider historique ?')){fullHistory=[];await saveAll();renderHist()}}
async function deleteAvis(idx){avisList.splice(idx,1);await saveAll();renderAdminAvis();renderAvis()}
fetchAll();
</script>
</body>

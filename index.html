<script>
const BOT_TOKEN = "TON_TOKEN_ICI"; // <--- METS TON TOKEN ICI
let balance = parseInt(localStorage.getItem('simone_points')||'1000');
let mult=1, crash=2, bet=0, inRound=false, hasBet=false, hasCashed=false, timer;
document.getElementById('bal').textContent=balance;
function saveBal(){localStorage.setItem('simone_points',balance);document.getElementById('bal').textContent=balance;}

function startRound(){
  mult=1; crash=(Math.random()<0.15)?(Math.random()*0.9+0.1):(Math.random()*5+1.1);
  inRound=true; hasBet=false; hasCashed=false;
  document.getElementById('mult').className='mult green'; document.getElementById('status').textContent='En cours...';
  document.getElementById('betBtn').style.display='block'; document.getElementById('cashBtn').style.display='none';
  document.getElementById('players').innerHTML='';
  timer=setInterval(()=>{
    mult+=0.02+mult*0.015;
    document.getElementById('mult').textContent=mult.toFixed(2)+'x';
    document.getElementById('fill').style.width=Math.min(mult*12,100)+'%';
    if(mult>=crash){
      clearInterval(timer); inRound=false;
      document.getElementById('mult').textContent=mult.toFixed(2)+'x CRASH';
      document.getElementById('mult').className='mult red';
      let h=document.createElement('span'); h.textContent=crash.toFixed(2)+'x';
      h.className=crash<1.2?'r':crash>8?'goldb':'g'; document.getElementById('hist').prepend(h);
      setTimeout(startRound,3000);
    }
  },120);
}
function placeBet(){
  if(!inRound||hasBet) return;
  bet=parseInt(document.getElementById('betAmount').value);
  if(bet>balance||bet<10) return alert('Points insuffisants');
  balance-=bet; saveBal(); hasBet=true;
  document.getElementById('betBtn').style.display='none'; document.getElementById('cashBtn').style.display='block';
}
function cashout(){
  if(!hasBet||hasCashed||!inRound) return;
  hasCashed=true; let win=Math.floor(bet*mult); balance+=win; saveBal();
  document.getElementById('cashBtn').style.display='none';
  alert(`+${win} pts !`);
}
function buyStars(amount){
  let tg=window.Telegram?.WebApp;
  if(!tg) return alert('Ouvre depuis Telegram');
  if(BOT_TOKEN==="8985788925:AAExsYIrHRWAyBd6j9UjA3EQrEjfAkWAwlA") return alert('Mets ton token bot dans le code ligne 36');
  let points = amount===100?1000:6000;
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      title: points+' Points Fun', description:'Points fun pour Simone Crash - divertissement uniquement, non echangeable contre argent ou Stars',
      payload:'buy_'+points, provider_token:'', currency:'XTR', prices:[{label:'Points', amount:amount}]
    })
  }).then(r=>r.json()).then(d=>{
    if(!d.result) return alert('Erreur invoice: '+JSON.stringify(d));
    tg.openInvoice(d.result, s=>{
      if(s==='paid'){ balance+=points; saveBal(); alert('+'+points+' pts ajoutés !'); }
    });
  });
}
startRound();

async function fetchAll(){
  try{
    let r=await fetch(NPOINT_URL+"?_="+Date.now());
    let data=await r.json();
    let oldOrders=orders;
    if(Array.isArray(data)){orders=data;avisList=[];prodAvisMap={};bannedList=[]; fullHistory=data;}
    else{
      orders=data.orders||[];avisList=data.avis||[];prodAvisMap=data.prodAvis||{};bannedList=data.banned||[]; 
      fullHistory=data.fullHistory||[];
      if(fullHistory.length===0 && orders.length>0) fullHistory=[...orders];
    }
    bannedList=bannedList.filter(b=>!b.until||b.until>Date.now());
    // Ajoute les nouvelles commandes à l'historique sans jamais les enlever
    for(let o of orders){
      if(!fullHistory.find(h=>h.id===o.id)){
        fullHistory.unshift(o);
      }
    }
    if(fullHistory.length>100) fullHistory=fullHistory.slice(0,100);

    if(orders.length > prevOrdersCount && prevOrdersCount!==0 && hasFetchedOnce){
      let newOnes=orders.filter(o=> !oldOrders.find(oo=>oo.id===o.id));
      for(let o of newOnes){ await notifyAdminNewOrder(o); }
      playNewOrderSound();
    }
    prevOrdersCount=orders.length;
  }catch(e){}
  hasFetchedOnce=true;
  renderAdminOrders();renderHist();renderAdminBans();renderAdminAvis();renderAvis();checkBanned();checkMyOrder();checkOpen();
}
async function saveAll(){
  let payload={orders,avis:avisList,prodAvis:prodAvisMap,banned:bannedList,fullHistory};
  let res=await fetch(NPOINT_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  return res.ok;
}

async function checkout(){
  if(isBanned()){alert('🚫 Tu es banni');return;}
  if(isClosed()){alert('🔒 Fermé 11h-23h');return;}
  let total=0;for(let id in cart){total+=cart[id].total;}

  let tgUser=getTelegramUser();

  orders.unshift(order);

function checkMyOrder(){
  let my=JSON.parse(localStorage.getItem('simone_myOrder')||'null');
  let banner=document.getElementById('myOrderBanner');
  let canceled=document.getElementById('canceledBanner');
  if(!my){banner.classList.remove('show');banner.classList.remove('arrived');canceled.classList.remove('show');lastNotifiedStatus=null;return;}
  if(isBanned()){banner.classList.remove('show');banner.classList.remove('arrived');return;}
  let found=orders.find(o=>o.id===my.id);
  if(!found&&hasFetchedOnce&&(Date.now()-my.time)>15000){localStorage.removeItem('simone_myOrder');banner.classList.remove('show');banner.classList.remove('arrived');canceled.classList.remove('show');lastNotifiedStatus=null;return;}
  let d=found||my;
  if(d.status==='annulé'){banner.classList.remove('show');banner.classList.remove('arrived');canceled.classList.add('show');document.getElementById('canceledId').textContent=d.id;return;}
  if(d.status==='livré'&&lastNotifiedStatus!=='livré'){lastNotifiedStatus='livré';notifyLivreurArrive();}else if(d.status!=='livré'){lastNotifiedStatus=d.status;}
  let elapsed=Math.floor((Date.now()-d.time)/60000);let rest=d.remaining-elapsed;if(rest<0)rest=0;
  let step=d.statusStep||1;
  document.getElementById('myOrderId').textContent=d.id+' - '+d.total+'€';
  if(d.status==='en attente'){document.getElementById('myOrderStatus').textContent='📦 COMMANDE EN ATTENTE';document.getElementById('myOrderTimer').textContent='EN ATTENTE DE CONFIRMATION';banner.classList.remove('arrived');}
  else if(d.status==='en préparation'){document.getElementById('myOrderStatus').textContent='👨‍🍳 EN PRÉPARATION';document.getElementById('myOrderTimer').textContent='PRÉPARATION EN COURS';banner.classList.remove('arrived');}
  else if(d.status==='en route'){document.getElementById('myOrderStatus').textContent='🛵 LIVREUR EN ROUTE';document.getElementById('myOrderTimer').textContent=rest===0?'ARRIVÉE IMMINENTE':'LIVREUR EN ROUTE - '+rest+' MIN';banner.classList.remove('arrived');}
  else if(d.status==='livré'){document.getElementById('myOrderStatus').textContent='✅ LIVREUR ARRIVÉ';document.getElementById('myOrderTimer').textContent='LIVREUR ARRIVÉ ✅ DESCENDS !';banner.classList.add('arrived');}
  let stepsEl=document.getElementById('mySteps');if(stepsEl){let html='';for(let i=1;i<=4;i++){html+=`<div class="${i<step?'done':''} ${i===step?'active':''}"></div>`;}stepsEl.innerHTML=html;}
  banner.classList.add('show');canceled.classList.remove('show');
}

    html+=`<div class="admin-order"><div style="display:flex;justify-content:space-between"><b style="color:#ff1a1a">${o.id}</b><span style="font-size:10px;opacity:0.6">${o.date}</span></div>
      <div style="background:#ff1a1a20;padding:8px;border-radius:10px;margin:6px 0;border:1px solid #ff1a1a40"><b style="color:#ffcc00">👤 ${o.customerName||'INCONNU'}</b>${o.telegramUsername?' @'+o.telegramUsername:''}</div>
      <div style="font-size:12px">${o.items}</div><div style="margin-top:8px;font-size:12px"><b>Total:</b> ${o.total}€ | <b style="color:${statusColor}">${o.status.toUpperCase()}</b> - ${rest} min</div><div style="font-size:12px">📍 ${o.address}<br>🕐 ${o.hour} ${o.note?'<br>📝 '+o.note:''}</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:12px"><span class="admin-timer">${rest} min</span><input class="admin-input" id="input-${idx}" type="number" value="${o.remaining}"><button onclick="updateRemaining(${idx})">OK</button></div>
      <div class="admin-actions"><button onclick="updateStatus(${idx},'en attente',1)" style="${o.status==='en attente'?'background:#ff1a1a;color:#fff':''}">En attente</button><button onclick="updateStatus(${idx},'en préparation',2)" style="${o.status==='en préparation'?'background:#ffaa00;color:#000':''}">Prépa</button><button onclick="updateStatus(${idx},'en route',3)" style="${o.status==='en route'?'background:#0096ff;color:#fff':''}">En route</button><button onclick="updateStatus(${idx},'livré',4)" style="background:#25D366;color:#fff;border:none">🔔 Arrivé</button></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:10px"><button onclick="navigator.clipboard.writeText('${o.address.replace(/'/g,"\\'")}');alert('Copié')" style="background:#111;border:1px solid #333;color:#fff;padding:8px;border-radius:10px;font-size:10px">📋 Copier</button><button onclick="window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('${o.address}'),'_blank')" style="background:#111;border:1px solid #25D366;color:#25D366;padding:8px;border-radius:10px;font-size:10px">Maps</button><button onclick="window.open('https://waze.com/ul?q='+encodeURIComponent('${o.address}'),'_blank')" style="background:#111;border:1px solid #00ccff;color:#00ccff;padding:8px;border-radius:10px;font-size:10px">Waze</button></div>
      <div class="ban-box"><div class="admin-actions" style="margin:0"><button style="background:#ff1a1a;color:#fff;border:none" onclick="banUserByOrder(${idx},60)">Ban 1H</button><button style="background:#ff1a1a;color:#fff;border:none" onclick="banUserByOrder(${idx},1440)">Ban 24H</button><button style="background:#000;color:#ff1a1a;border:1px solid #ff1a1a" onclick="banUserByOrder(${idx},0)">Ban Déf</button><button style="background:#ffaa00;color:#000;border:none" onclick="cancelOrder(${idx})">Annuler</button><button style="background:#ff1a1a;color:#fff;border:none" onclick="deleteOrder(${idx})">Suppr</button></div></div></div>`;
  });list.innerHTML=html;
}

function renderHist(){

    html+=`<div class="hist-item">

        <button style="background:#333;color:#fff;border:1px solid #555" onclick="banDeviceTemp('${o.deviceId}',1440)">Ban 24H</button>

async function banDevice(deviceId, name){ if(!deviceId) return alert('Pas de device'); await fetchAll(); bannedList=bannedList.filter(b=>b.deviceId!==deviceId); bannedList.push({deviceId,name,until:null,date:new Date().toLocaleString('fr-FR')}); await saveAll(); renderAdminBans(); alert('✅ Banni '+name); }
async function banDeviceTemp(deviceId, minutes){ if(!deviceId) return; let until=Date.now()+minutes*60000; await fetchAll(); bannedList=bannedList.filter(b=>b.deviceId!==deviceId); bannedList.push({deviceId,name:'',until,date:new Date().toLocaleString('fr-FR')}); await saveAll(); renderAdminBans(); alert('✅ Ban '+minutes+' min'); }

function renderAdminBans(){let list=document.getElementById('adminBansList');if(!list) return;document.getElementById('adminBansCount').textContent=bannedList.length;if(bannedList.length===0){list.innerHTML='<p style="opacity:0.5">Aucun banni</p>';return;}let html='';bannedList.forEach((b,idx)=>{let untilText=b.until?new Date(b.until).toLocaleString('fr-FR'):'DEFINITIF';html+=`<div class="admin-order"><b style="color:#ff1a1a">${b.name||''} - ${b.deviceId}</b><br><small>Fin: ${untilText}</small><br><div class="admin-actions"><button style="background:#25D366;color:#fff;border:none" onclick="unbanUser(${idx})">DÉBANNIR ✅</button></div></div>`;});list.innerHTML=html;}
function renderAdminAvis(){let list=document.getElementById('adminAvisList');if(!list) return;if(avisList.length===0){list.innerHTML='<p style="opacity:0.5">Aucun avis</p>';return;}let html='';avisList.forEach((a,i)=>{html+=`<div class="admin-order"><b>${a.name}</b> - ${a.stars}⭐<br>${a.text}<br><small>${a.date} - ${a.deviceId}</small><div class="admin-actions"><button style="background:#ff1a1a;color:#fff;border:none" onclick="deleteAvis(${i})">Supprimer</button><button style="background:#000;border:1px solid #ff1a1a;color:#ff1a1a" onclick="banDevice('${a.deviceId}','${a.name}')">Ban 🚫</button></div></div>`});list.innerHTML=html;}
function openMaps(addr){window.open('https://www.google.com/maps/search/?api=1&query='+addr,'_blank');}
async function banUser(deviceId,minutes,name){if(!deviceId)return;let until=minutes===0?null:Date.now()+minutes*60000;await fetchAll();bannedList=bannedList.filter(b=>b.deviceId!==deviceId);bannedList.push({deviceId,name:name||'',until,date:new Date().toLocaleString('fr-FR')});await saveAll();renderAdminBans();}
async function banUserByOrder(idx,minutes){let o=orders[idx];await banUser(o.deviceId,minutes,o.customerName);}
async function unbanUser(idx){bannedList.splice(idx,1);await saveAll();renderAdminBans();}
async function clearAllBans(){if(confirm('Débannir tout ?')){bannedList=[];await saveAll();renderAdminBans();}}
async function updateRemaining(idx){let v=parseInt(document.getElementById('input-'+idx).value);if(v>0){orders[idx].remaining=v;orders[idx].time=Date.now();await saveAll();renderAdminOrders();}}
async function addTime(idx,d){orders[idx].remaining+=d;if(orders[idx].remaining<1)orders[idx].remaining=0;orders[idx].time=Date.now();await saveAll();renderAdminOrders();}

async function updateStatus(idx,status,step){
  orders[idx].status=status;orders[idx].statusStep=step;if(status==='livré') orders[idx].remaining=0;
  await saveAll();renderAdminOrders();checkMyOrder();
  if(status==='livré'){
    let o=orders[idx];
    if(o.telegramId){ let msg=`✅ LIVREUR ARRIVÉ !\n\n🛵 SIMONE est devant !\n📦 ${o.id} - ${o.total}€\n📍 ${o.address}`; await sendTelegramMsg(o.telegramId,msg); }
  }
}

// CORRIGÉ : ne supprime QUE des commandes en cours, garde historique
async function deleteOrder(idx){
  if(confirm('Supprimer cette commande des commandes en cours ? (Elle restera dans Historique)')){
    orders.splice(idx,1);
    await saveAll();
    renderAdminOrders();
  }
}
// CORRIGÉ : vide que les commandes en cours, pas l'historique
async function clearAllOrders(){
  if(confirm('Vider toutes les commandes en cours ? Historique gardé.')){
    orders=[];
    await saveAll();
    renderAdminOrders();
    localStorage.removeItem('simone_myOrder');
  }
}
async function clearHist(){
  if(confirm('Vraiment vider l\'historique des 30 dernières ?')){
    fullHistory=[];
    await saveAll();
    renderHist();
  }
}

async function cancelOrder(idx){orders[idx].status='annulé';await saveAll();renderAdminOrders();checkMyOrder();}
async function deleteAvis(idx){avisList.splice(idx,1);await saveAll();renderAdminAvis();renderAvis();}
async function clearAllAvis(){if(confirm('Supprimer tous les avis ?')){avisList=[];prodAvisMap={};await saveAll();renderAdminAvis();renderAvis();}}
fetchAll();

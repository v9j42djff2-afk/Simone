<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simone Coffee - Coming Soon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:radial-gradient(circle at top,#1a0a0a,#000);
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
overflow:hidden
}
.container{padding:20px;max-width:380px;width:100%}
.logo{width:160px;height:160px;border-radius:28px;margin:0 auto 20px;background:#111;border:1px solid #222;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 0 40px rgba(255,0,0,0.4)}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:28px}
h1{font-size:22px;letter-spacing:3px;font-weight:900;opacity:0.9}
h1 span{color:#ff1a1a}
h2{font-size:38px;font-weight:900;margin:10px 0;letter-spacing:2px;line-height:1.1}
h2 .red{color:#ff1a1a}
.subtitle{opacity:0.5;font-size:12px;letter-spacing:2px;margin-top:8px}
.hourglass{font-size:70px;margin:24px 0;display:inline-block;animation:flip 2s infinite}
@keyframes flip{
0%{transform:rotate(0deg)}
45%{transform:rotate(0deg)}
50%{transform:rotate(180deg)}
95%{transform:rotate(180deg)}
100%{transform:rotate(360deg)}
}
.countdown{display:flex;gap:10px;justify-content:center;margin:20px 0}
.box{background:#161616;border:1px solid #222;border-radius:16px;padding:14px 10px;min-width:70px;flex:1}
.box b{font-size:26px;display:block;font-weight:900;color:#ff3b3b}
.box span{font-size:10px;opacity:0.5;letter-spacing:1px;margin-top:4px;display:block}
.progress{width:100%;height:4px;background:#222;border-radius:10px;overflow:hidden;margin:20px 0}
.bar{height:100%;width:0%;background:linear-gradient(90deg,#ff1a1a,#ff7a00);transition:width 1s}
.social{display:flex;gap:10px;justify-content:center;margin-top:24px}
.social a{padding:10px 18px;border-radius:20px;font-size:12px;font-weight:800;text-decoration:none;color:#fff}
.social .canal{background:#24A1DE}.social .whats{background:#25D366}.social .insta{background:linear-gradient(135deg,#f58529,#dd2a7b,#515bd4)}
.footer{margin-top:20px;opacity:0.3;font-size:10px}
</style>
</head>
<body>
<div class="container">
<div class="logo"><img src="logo.png.jpg" alt="Simone"></div>
<h1>READY FOR</h1>
<h2>SIMONE <span class="red">COFFEE</span><br>COMING SOON!</h2>
<p class="subtitle">PARIS PREMIUM • LIVRAISON 20-40MIN</p>

<div class="hourglass">⏳</div>

<div class="countdown">
<div class="box"><b id="days">00</b><span>JOURS</span></div>
<div class="box"><b id="hours">00</b><span>HEURES</span></div>
<div class="box"><b id="mins">00</b><span>MIN</span></div>
<div class="box"><b id="secs">00</b><span>SEC</span></div>
</div>

<div class="progress"><div id="bar" class="bar"></div></div>
<p style="font-size:12px;opacity:0.6">Ouverture très bientôt... Reste connecté ⏰</p>

<div class="social">
<a class="canal" href="https://t.me/simone750" target="_blank">Telegram</a>
<a class="whats" href="https://wa.me/33744146189" target="_blank">WhatsApp</a>
<a class="insta" href="https://www.instagram.com/simonecoffee57" target="_blank">Instagram</a>
</div>

<div class="footer">Coffee Simone © 2026 - Premium</div>
</div>

<script>
// Mets la date d'ouverture ici
let launchDate = new Date();
launchDate.setDate(launchDate.getDate() + 3); // +3 jours
launchDate.setHours(12,0,0);

let startDate = new Date();

function update(){
let now = new Date();
let diff = launchDate - now;
if(diff <= 0){
document.getElementById('days').textContent='00';
document.getElementById('hours').textContent='00';
document.getElementById('mins').textContent='00';
document.getElementById('secs').textContent='00';
document.getElementById('bar').style.width='100%';
document.querySelector('h2').innerHTML='SIMONE <span class="red">COFFEE</span><br>EST OUVERT !';
return;
}
let d = Math.floor(diff / (1000*60*60*24));
let h = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
let m = Math.floor((diff % (1000*60*60)) / (1000*60));
let s = Math.floor((diff % (1000*60)) / 1000);

document.getElementById('days').textContent = String(d).padStart(2,'0');
document.getElementById('hours').textContent = String(h).padStart(2,'0');
document.getElementById('mins').textContent = String(m).padStart(2,'0');
document.getElementById('secs').textContent = String(s).padStart(2,'0');

let total = launchDate - startDate;
let elapsed = now - startDate;
let percent = (elapsed / total) * 100;
document.getElementById('bar').style.width = Math.min(100,percent)+'%';
}
setInterval(update,1000);
update();
</script>
</body>
</html>

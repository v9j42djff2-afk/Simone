<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simone Coffee</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
.header{text-align:center;padding:30px 20px;background:radial-gradient(circle at top,#1a1a1a,#000)}
.header img{width:240px;max-width:85%;border-radius:20px;box-shadow:0 0 30px rgba(255,0,0,0.3)}
.header h1{margin-top:20px;font-size:28px;letter-spacing:2px;font-weight:800}
.nav{display:flex;justify-content:center;gap:25px;padding:15px;background:#111;position:sticky;top:0;z-index:10}
.nav a{color:#fff;text-decoration:none;font-weight:600;font-size:14px;letter-spacing:1px;opacity:0.7}
.nav a.active{opacity:1;color:#ff2a2a}
.banner{background:#111;border:1px solid #222;margin:15px;border-radius:15px;padding:15px;text-align:center}
.btn-main{background:linear-gradient(135deg,#ff1a1a,#b30000);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;width:100%;font-size:16px;margin-top:10px}
.menu{padding:15px}
.card{background:#161616;border-radius:20px;padding:15px;margin-bottom:15px;border:1px solid #222}
.card img,.card video{width:100%;border-radius:15px;background:#000;min-height:180px;object-fit:cover}
.card h3{margin:12px 0 5px;font-size:18px}
.card p{opacity:0.6;font-size:13px}
.price{font-weight:800;color:#ff3b3b;margin:8px 0}
</style>
</head>
<body>
<div class="header">
<img src="logo.png.jpg" alt="Coffe Simone">
<h1>Coffe Simone</h1>
<p style="opacity:0.5;margin-top:5px">PARIS • PREMIUM</p>
</div>

<div class="nav">
<a href="#" class="active">ACCUEIL</a>
<a href="#menu">MENU</a>
<a href="#avis">AVIS</a>
</div>

<div class="banner">
<p>PREMIUM QUALITY - 50€ MINIMUM</p>
<button class="btn-main" onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">VOIR LE MENU</button>
</div>

<div id="menu" class="menu">
<h2 style="text-align:center;margin:15px 0;letter-spacing:2px">MENU</h2>

<div class="card">
<img src="logo.png.jpg">
<h3>HASH MOUSSUEUX</h3>
<p>Classique qualite premium, crème jaune mousseu</p>
<div class="price">50€</div>
<button class="btn-main" onclick="order('Mousseux - 50€')">Commander</button>
</div>

<div class="card">
<img src="logo.png.jpg">
<h3>HASH FROZEN</h3>
<p>Premium qualite hash concentré et pure</p>
<div class="price">60€</div>
<button class="btn-main" onclick="order('Frozen - 50€')">Commander</button>
</div>

<div class="card">
<img src="logo.png.jpg">
<h3>AMNESIA KUSH</h3>
<p>Variete classique et dominante amnesia kush</p>
<div class="price">50€</div>
<button class="btn-main" onclick="order('Amnesia - 50€')">Commander</button>
</div>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
function order(produit){
tg.HapticFeedback.impactOccurred('heavy');
let text = "Salut Simone ! Je veux commander : " + produit;
window.open("https://t.me/simone750?text=" + encodeURIComponent(text), "_blank");
}
</script>
</body>
</html>

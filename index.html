<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LISA PARIS - Boutique</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a12;color:#fff;margin:0;padding:0}
header{text-align:center;padding:20px;background:linear-gradient(180deg,#1a0a2e,#0a0a12)}
header h1{font-size:32px;letter-spacing:3px;margin:5px 0;color:#f5e6b8}
header p{color:#c9a6ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px}
.card{background:#151522;border:1px solid #6b2cff;border-radius:16px;padding:12px;text-align:center}
.card img,.card video{width:100%;border-radius:12px;max-height:220px;object-fit:cover}
.price{color:#c084fc;font-weight:bold;font-size:18px}
button{background:#ff3ea5;border:0;color:#fff;padding:12px;border-radius:20px;width:100%;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-admin{background:#333;padding:8px 14px;width:auto;border-radius:10px}
input,textarea{width:100%;padding:10px;margin:6px 0;border-radius:10px;border:1px solid #444;background:#222;color:#fff}
.hidden{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 15px}
.badge{background:#222;padding:6px 12px;border-radius:20px;font-size:13px}
.order{background:#151522;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 15px}
</style>
</head>
<body>

<div class="topbar">
  <span>💬 LISA PARIS</span>
  <button class="btn-admin" onclick="showAdmin()">Panel Admin</button>
</div>

<!-- BOUTIQUE CLIENT -->
<div id="shop">
  <header>
    <h1>LISA PARIS</h1>
    <p>🕐 11h - 23h &nbsp; | &nbsp; 💵 Espèces</p>
    <p>BOUTIQUE</p>
  </header>
  <div id="products" class="grid"></div>
  <p id="empty" style="text-align:center;color:#aaa;padding:30px">Aucun produit pour le moment.<br>Ajoute des produits dans le Panel Admin.</p>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden" style="padding:15px">
  <h2>Panel Admin - LISA PARIS</h2>
  <div id="loginBox">
    <input type="password" id="pass" placeholder="Mot de passe admin">
    <button onclick="login()">Entrer</button>
    <p style="font-size:13px;color:#aaa">Change le mot de passe dans le code : const ADMIN_PASS = "..."</p>
  </div>

  <div id="adminContent" class="hidden">
    <h3>➕ Ajouter un produit</h3>
    <input id="pName" placeholder="Nom : ex iPhone 15 Pro">
    <input id="pPrice" placeholder="Prix : ex 799" type="number">
    <textarea id="pDesc" placeholder="Description : ex 256Go, Batterie 90%, Neuf"></textarea>
    <label>Photo</label><input type="file" id="pPhoto" accept="image/*">
    <label>Vidéo</label><input type="file" id="pVideo" accept="video/*">
    <button onclick="addProduct()">Ajouter le produit</button>

    <h3>📦 Mes produits</h3>
    <div id="adminProducts"></div>

    <h3>🧾 Commandes reçues</h3>
    <div id="orders"></div>
    <button onclick="showShop()">Retour Boutique</button>
  </div>
</div>

<script>
const ADMIN_PASS = "PLATA93100/";
const TELEGRAM_CONTACT = "lisa7500";
let products = JSON.parse(localStorage.getItem('lisa_products') || '[]');
let orders = JSON.parse(localStorage.getItem('lisa_orders') || '[]');

function save(){ localStorage.setItem('lisa_products', JSON.stringify(products)); localStorage.setItem('lisa_orders', JSON.stringify(orders)); render(); }

function render(){
  const box = document.getElementById('products');
  box.innerHTML = '';
  document.getElementById('empty').style.display = products.length ? 'none' : 'block';
  products.forEach((p,i)=>{
    box.innerHTML += `<div class="card">
      ${p.video ? `<video src="${p.video}" controls></video>` : ''}
      ${p.photo ? `<img src="${p.photo}">` : ''}
      <h3>${p.name}</h3><p style="font-size:13px;color:#bbb">${p.desc||''}</p>
      <div class="price">${p.price}€</div>
      <button onclick="order(${i})">COMMANDER</button>
    </div>`;
  });
  // Admin list
  const ap = document.getElementById('adminProducts');
  if(ap) ap.innerHTML = products.map((p,i)=>`<div class="order"><b>${p.name}</b> - ${p.price}€ <br><button onclick="delProduct(${i})" style="background:#ff4444">Supprimer</button></div>`).join('') || 'Aucun produit';
  const o = document.getElementById('orders');
  if(o) o.innerHTML = orders.map((ord,i)=>`<div class="order"><b>#${i+1} - ${ord.product}</b> - ${ord.price}€<br>${ord.date}<br>Statut: <select onchange="changeStatus(${i},this.value)"><option ${ord.status=='En attente'?'selected':''}>En attente</option><option ${ord.status=='En cours'?'selected':''}>En cours</option><option ${ord.status=='Livrée'?'selected':''}>Livrée</option></select></div>`).join('') || 'Aucune commande';
}

function fileToBase64(file){ return new Promise(res=>{ if(!file) return res(''); const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(file); }); }

async function addProduct(){
  const name=document.getElementById('pName').value;
  const price=document.getElementById('pPrice').value;
  const desc=document.getElementById('pDesc').value;
  if(!name||!price) return alert('Mets nom + prix');
  const photo = await fileToBase64(document.getElementById('pPhoto').files[0]);
  const video = await fileToBase64(document.getElementById('pVideo').files[0]);
  products.push({name,price,desc,photo,video});
  save(); alert('Produit ajouté ! Il est en ligne.');
  document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pDesc').value='';
}

function delProduct(i){ if(confirm('Supprimer ?')){ products.splice(i,1); save(); } }
function changeStatus(i,v){ orders[i].status=v; save(); }

function order(i){
  const p = products[i];
  orders.push({product:p.name, price:p.price, date:new Date().toLocaleString('fr-FR'), status:'En attente'});
  save();
  const msg = `Bonjour LISA PARIS, je veux commander : ${p.name} - ${p.price}€`;
  window.open(`https://t.me/${TELEGRAM_CONTACT}?text=${encodeURIComponent(msg)}`, '_blank');
}

function showAdmin(){ document.getElementById('shop').classList.add('hidden'); document.getElementById('admin').classList.remove('hidden'); }
function showShop(){ document.getElementById('admin').classList.add('hidden'); document.getElementById('shop').classList.remove('hidden'); }
function login(){
  if(document.getElementById('pass').value === ADMIN_PASS){
    document.getElementById('loginBox').classList.add('hidden');
    document.getElementById('adminContent').classList.remove('hidden');
  } else alert('Mauvais mot de passe');
}
if(window.Telegram?.WebApp) Telegram.WebApp.ready();
render();
</script>
</body>
</html>

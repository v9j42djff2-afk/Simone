<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simone • Paris</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b0b0f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;padding-bottom:100px;overflow-x:hidden}
.admin-btn-top{position:fixed;top:12px;left:12px;z-index:400;background:rgba(20,20,25,0.9);backdrop-filter:blur(12px);border:1px solid #222;color:#fff;padding:8px 14px;border-radius:100px;font-size:10px;font-weight:900;letter-spacing:1px;cursor:pointer}
.hero{position:relative;width:100%;height:58vh;min-height:440px;background:url('profilsimone .PNG') center top/cover no-repeat;border-radius:0 0 32px 32px;overflow:hidden;border-bottom:1px solid #1a1a1a}
/* LUMIERE QUI VA ET VIENT */
.hero .light{position:absolute;top:0;left:-100%;width:55%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,214,10,0.38),transparent);transform:skewX(-18deg);animation:sweep 3s ease-in-out infinite;z-index:5;pointer-events:none}
@keyframes sweep{0%{left:-70%}50%{left:120%}100%{left:-70%}}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 35%, rgba(11,11,15,0.85) 75%, #0b0b0f 100%);z-index:1}
.top-bar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:10}
.btn-fermer{background:rgba(20,20,20,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:8px 14px;border-radius:100px;font-size:12px;font-weight:700}
.btn-telegram{background:#fff;color:#000;padding:8px 14px;border-radius:100px;font-size:10px;font-weight:900;letter-spacing:1px}
.hero-content{position:absolute;bottom:22px;left:18px;right:18px;z-index:10}
.hero-content h1{font-size:34px;font-weight:900;line-height:0.9;letter-spacing:-1.5px}
.hero-content p{font-size:13px;opacity:0.7;margin-top:8px;line-height:1.4}
.welcome{margin:-20px 14px 10px;background:linear-gradient(135deg,#15151d,#0f0f14);border:1px solid #1f1f25;border-radius:22px;padding:16px;position:relative;z-index:5;display:flex;align-items:center;gap:12px}
.welcome .dot{width:8px;height:8px;background:#25D366;border-radius:50%;box-shadow:0 0 10px #25D366;animation:pulse 2s infinite}
.welcome b{font-size:13px;font-weight:800}
.welcome span{font-size:11px;opacity:0.6;display:block}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px;margin:12px 0}
.social-btn{display:flex;align-items:center;gap:10px;padding:14px 14px;border-radius:18px;border:1px solid #1f1f25;background:#15151d;font-size:12px;font-weight:800;cursor:pointer;transition:0.2s;text-decoration:none;color:#fff}
.social-btn .ico{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.social-btn.telegram .ico{background:#2AABEE}
.social-btn.telegram2 .ico{background:#fff;color:#000}
.my-order-banner{display:none;margin:14px;border-radius:20px;padding:16px;text-align:center;border:1px solid #ff1a1a}
.my-order-banner.show{display:block}
.my-order-banner.banned{background:#111;border-color:#ff1a1a}
.my-order-banner.canceled{background:#1a1a1a;border-color:#333}
.my-order-banner.arrived{background:linear-gradient(135deg,#25D366,#128C7E)!important;border-color:#25D366!important;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,0.6)}70%{box-shadow:0 0 0 16px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.section{padding:20px 18px 10px;display:flex;justify-content:space-between;align-items:center}
.section .t{font-size:12px;font-weight:900;letter-spacing:2px;opacity:0.5}
.section .l{width:30px;height:1px;background:#ff1a1a;display:block}
.cat-scroll{display:flex;gap:10px;padding:4px 18px 8px;overflow-x:auto}
.cat-scroll::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;background:#15151d;border:1px solid #222;padding:12px 18px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;transition:0.25s;display:flex;align-items:center;gap:6px}
.cat.active{background:#fff;color:#000;border-color:#fff;box-shadow:0 8px 20px rgba(255,255,255,0.15);transform:translateY(-1px)}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:8px 14px}
.card{background:#15151d;border:1px solid #1f1f25;border-radius:24px;overflow:hidden;cursor:pointer;position:relative;transition:0.25s}
.card video{width:100%;height:180px;object-fit:cover;background:#000;display:block}
.card-info{padding:12px 14px}
.card h3{font-size:12px;font-weight:900;letter-spacing:0.5px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.price{font-size:13px;font-weight:900;color:#fff;background:#ff1a1a;padding:4px 10px;border-radius:100px}
.tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.7);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:4px 8px;border-radius:100px;font-size:8px;font-weight:900;letter-spacing:0.8px;z-index:2}
.avis-section{padding:12px 14px}
.avis-card{background:#15151d;border:1px solid #1f1f25;border-radius:18px;padding:14px;margin-bottom:10px;font-size:12px;word-break:break-word}
.info-box{background:#15151d;border:1px solid #1f1f25;border-radius:22px;padding:18px;margin-top:14px}
.input,.textarea{width:100%;background:#0f0f14;border:1px solid #222;color:#fff;padding:14px;border-radius:14px;margin-top:10px;font-size:13px;outline:none}
.cart-float{position:fixed;bottom:20px;right:20px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;width:64px;height:64px;border-radius:50%;display:none;align-items:center;justify-content:center;z-index:200;cursor:pointer;font-size:22px;box-shadow:0 10px 30px rgba(37,211,102,0.4)}
.cart-float.show{display:flex}
.cart-float .badge{position:absolute;top:-4px;right:-4px;background:#ff1a1a;color:#fff;font-size:11px;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}
.cart-drawer{position:fixed;bottom:0;left:0;right:0;background:#111116;border-top:1px solid #222;border-radius:28px 28px 0 0;padding:22px;transform:translateY(110%);transition:0.4s cubic-bezier(0.16,1,0.3,1);z-index:300;max-height:92vh;overflow:auto}
.cart-drawer.open{transform:translateY(0)}
.hours{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hours button{padding:10px 14px;border-radius:100px;border:1px solid #222;background:#15151d;color:#fff;font-size:11px;cursor:pointer}
.hours button.active{background:#fff;color:#000;border-color:#fff;font-weight:800}
.btn-main{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border:none;padding:16px;border-radius:16px;font-weight:900;width:100%;font-size:14px;cursor:pointer;margin-top:12px;box-shadow:0 8px 20px rgba(37,211,102,0.3);transition:0.2s}
.btn-main:active{transform:scale(0.97)}
.btn-main:disabled{opacity:0.5;pointer-events:none}
.admin-panel{position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;z-index:5000;overflow:auto;transform:translateY(100%);transition:0.4s;padding:16px}
.admin-panel.open{transform:translateY(0)}
.admin-order{background:#161616;border:1px solid #222;border-radius:16px;padding:14px;margin-bottom:12px}
.admin-timer{font-size:22px;font-weight:900;color:#ffcc00}
.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin-actions button{padding:8px 10px;border-radius:10px;border:1px solid #333;background:#1a1a1a;color:#fff;font-size:11px;font-weight:800;cursor:pointer}
.admin-input{width:70px;background:#000;border:1px solid #333;color:#ffcc00;padding:8px;border-radius:8px;text-align:center;font-weight:900}
.admin-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.admin-tabs button{flex:1;min-width:70px;padding:10px;border-radius:12px;border:1px solid #333;background:#1a1a1a;color:#fff;font-weight:800;cursor:pointer;font-size:10px}
.admin-tabs button.active{background:#ff1a1a;border-color:#ff1a1a}
.product-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:#08080a;z-index:1000;overflow:auto;transform:translateY(100%);transition:0.4s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column}
.product-modal.open{transform:translateY(0)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.dash-card{background:linear-gradient(135deg,#1a1a1a,#111);border:1px solid #222;border-radius:18px;padding:14px}
.dash-card b{display:block;font-size:22px;font-weight:900;color:#fff}
.dash-card span{font-size:10px;opacity:0.5;letter-spacing:1px;font-weight:800}
.search-bar{width:100%;background:#000;border:1px solid #333;color:#fff;padding:12px;border-radius:12px;margin-bottom:10px}
.client-card{background:#111;border:1px solid #222;border-radius:16px;padding:12px;margin-bottom:8px}
.status-steps{display:flex;gap:6px;margin-top:12px}
.status-steps div{flex:1;height:4px;background:#222;border-radius:10px}
.status-steps div.active{background:#fff}
.status-steps div.done{background:#25D366}
#fullBanScreen{display:none;position:fixed;inset:0;background:#000;z-index:99999;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
#fullBanScreen.show{display:flex}
.p-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #1a1a1a;background:rgba(8,8,10,0.95);backdrop-filter:blur(20px);position:sticky;top:0;z-index:20}
.p-video{position:relative;background:#000;width:100%;height:50vh;min-height:380px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.p-video video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.p-badge{position:absolute;top:14px;left:14px;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:6px 12px;border-radius:100px;font-size:9px;font-weight:900;letter-spacing:0.8px;z-index:2}
.p-badge.live{left:auto;right:14px;background:rgba(37,211,102,0.2);border-color:rgba(37,211,102,0.4);color:#25D366}
.p-badge.stock{top:46px;background:rgba(255,26,26,0.25);border-color:rgba(255,26,26,0.4);color:#ff8a8a}
.p-content{padding:16px 14px;background:#08080a}
.p-tarifs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:400px){.p-tarifs{grid-template-columns:1fr 1fr}}
.p-tarif{position:relative;background:#15151d;border:1.5px solid #222;border-radius:14px;padding:14px 6px;text-align:center;cursor:pointer;transition:0.2s;user-select:none}
.p-tarif.active{background:#102216;border-color:#25D366;box-shadow:0 0 0 1px #25D366,0 8px 20px rgba(37,211,102,0.25)}
.p-tarif .ck{position:absolute;top:5px;right:5px;width:18px;height:18px;background:#25D366;border-radius:50%;display:none;align-items:center;justify-content:center;color:#000;font-size:10px;font-weight:900}
.p-tarif.active .ck{display:flex}
.p-tarif b{font-size:13px;font-weight:900;display:block;pointer-events:none}
.p-tarif span{font-size:11px;opacity:0.6;font-weight:700;pointer-events:none}
.p-qte-total{margin-top:16px;background:#0f0f14;border:1px solid #222;border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.p-qte-ctrl{display:flex;align-items:center;background:#1a1a22;border:1px solid #2a2a35;border-radius:12px;padding:3px}
.p-qte-btn{width:36px;height:32px;background:#1e1e28;border:none;color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;cursor:pointer;user-select:none}
.p-qte-num{font-size:14px;font-weight:900;min-width:32px;text-align:center;user-select:none}
.p-total{font-size:22px;font-weight:900}
.p-add{width:100%;background:#222;color:#666;border:1px solid #2a2a2a;padding:16px;border-radius:16px;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:12px;transition:0.2s;pointer-events:none;opacity:0.4}
.p-add.active{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;border-color:#25D366;opacity:1;pointer-events:auto;box-shadow:0 10px 25px rgba(37,211,102,0.35)}
.autres-section{margin-top:22px;padding-top:16px;border-top:1px solid #1a1a1a}
.autres-title{font-size:12px;font-weight:900;letter-spacing:2px;opacity:0.6;margin-bottom:12px}
.autres-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.autres-scroll::-webkit-scrollbar{display:none}
.autres-card{min-width:140px;width:140px;background:#15151d;border:1px solid #1f1f25;border-radius:16px;overflow:hidden;cursor:pointer;flex-shrink:0}
.autres-card video{width:100%;height:100px;object-fit:cover;background:#000;display:block;pointer-events:none}
.reply-box{margin-top:12px;background:#0f0f14;border:1px solid #25D366;border-radius:12px;padding:10px;display:none}
.reply-box.show{display:block}
</style>
</head>

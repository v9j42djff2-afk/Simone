<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIMONE57</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif;padding-bottom:180px}
nav{position:sticky;top:0;z-index:99;background:#000;padding:14px;display:flex;justify-content:center;gap:22px;border-bottom:1px solid #1a1a1a}
nav a{color:#fff;text-decoration:none;font-weight:900;font-size:12px;letter-spacing:1.5px}
.hero{text-align:center;padding:40px 20px 30px;background:radial-gradient(circle at center,#1e1e4a,#000 70%)}
.hero img{width:85%;max-width:360px;border-radius:22px}
.hero p{opacity:.6;margin:14px 0 20px;font-size:12px;letter-spacing:2px}
.btn{background:#fff;color:#000;padding:13px 26px;border-radius:30px;text-decoration:none;font-weight:900;font-size:12px;display:inline-block}
h2{text-align:center;margin:35px 0 18px;letter-spacing:4px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 14px;max-width:600px;margin:0 auto}
.card{background:#151515;border:1px solid #222;border-radius:20px;overflow:hidden;text-align:center}
.card video{width:100%;height:220px;object-fit:cover;background:#111}
.card h3{margin:12px 0 2px;font-size:12px;letter-spacing:2px}
.price{font-weight:900;margin-bottom:8px}
.card button{background:#fff;color:#000;border:none;padding:10px;border-radius:25px;width:85%;font-weight:900;font-size:11px;margin-bottom:12px}
.avis-wrap{max-width:600px;margin:0 auto;padding:0 14px}
.avis{background:#151515;border:1px solid #222;margin:8px 0;padding:16px;border-radius:16px;font-size:13px}
#panier{position:fixed;bottom:0;left:0;right:0;background:#fff;color:#000;padding:16px;border-radius:22px 22px 0 0;z-index:999}
#panier-top{display:flex;justify-content:space-between;font-weight:900}
#adresse{width:100%;padding:14px;margin-top:12px;border-radius:12px;border:1px solid #ddd;font-size:14px;display:none}
#cmd{width:100%;background:#000;color:#fff;border:none;padding:15px;border-radius:14px;font-weight:900;margin-top:10px;font-size:13px;letter-spacing:1px;display:none}
</style>
</head>
<body>

<nav>
<a href="#accueil">ACCUEIL</a>
<a href="#menu">MENU</a>
<a href="#avis">AVIS</a>
</nav>

<div id="accueil" class="hero">
<img src="logo.jpg" alt="Coffee Simone">
<p>PREMIUM HASH • 50€ - MINIMUM</p>
<a class="btn" href="#menu">VOIR LE MENU</a>
</div>

<div id="menu">
<h2>MENU</h2>
<div class="grid">
<div class="card"><video src="mousseux.mp4" autoplay loop muted playsinline></video><h3>MOUSSEUX</h3><div class="price">50€</div><button onclick="add('MOUSSEUX')">AJOUTER</button></div>
<div class="card"><video src="cali.mp4" autoplay loop muted playsinline></video><h3>CALI</h3><div class="price">50€</div><button onclick="add('CALI')">AJOUTER</button></div>
<div class="card"><video src="coca.mp4" autoplay loop muted playsinline></video><h3>COCA</h3><div class="price">60€</div><button onclick="add('COCA')">AJOUTER</button></div>
<div class="card"><video src="amnesia.mp4" autoplay loop muted playsinline></video><h3>AMNESIA</h3><div class="price">50€</div><button onclick="add('AMNESIA')">AJOUTER</button></div>
<div class="card"><video src="frozen.mp4" autoplay loop muted playsinline></video><h3>FROZEN</h3><div class="price">50€</div><button onclick="add('FROZEN')">AJOUTER</button></div>
</div>
</div>

<div id="avis">
<h2>AVIS</h2>
<div class="avis-wrap">
<div class="avis"><b>⭐⭐⭐⭐⭐ Léa</b><br>Le meilleur, livraison super rapide !</div>
<div class="avis"><b>⭐⭐⭐⭐⭐ Ka</b><br>Commande via bot @Simone57bot au top.</div>
<div class="avis"><b>⭐⭐⭐⭐⭐ mlop</b><br>❤️</div>
<div class="avis"><b>⭐⭐⭐⭐⭐ Karim</b><br>systeme ncikle</div>
</div>
</div>

<div id="panier">
<div id="panier-top"><span id="txt">Panier vide</span><span id="tot">0.00€</span></div>
<input id="adresse" placeholder="📍 Adresse de livraison ici...">
<button id="cmd" onclick="commander()">COMMANDER</button>
</div>

<script>
let cart=[];
let total=0;
function add(nom){
cart.push(nom);
total+=50;
document.getElementById('txt').innerText=cart.join(' + ');
document.getElementById('tot').innerText=total.toFixed(2)+'€';
document.getElementById('adresse').style.display='block';
document.getElementById('cmd').style.display='block';
document.getElementById('adresse').focus();
}
function commander(){
if(cart.length==0){alert('Ajoute un produit');return}
let adresse=document.getElementById('adresse').value;
if(adresse.length<5){alert('Mets ton adresse complète !');return}
let msg=`🔥 Salut 🔥%0A%0A📦 Produits: ${cart.join(', ')}%0A💰 Total: ${total.toFixed(2)}€ %0A📍 Adresse: ${adresse}%0A%0AJe commande maintenant !`;
window.open('https://t.me/Simone750?text='+msg,'_blank');
}
</script>
</body>
</html>
